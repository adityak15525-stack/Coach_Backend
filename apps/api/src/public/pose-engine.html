<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>NEURAL COACH · POSE ENGINE</title>
<script src="/mp/vision_bundle.js"></script>
<style>
  html, body { margin:0; height:100%; background:#05050A; overflow:hidden; }
  #status {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#22D3EE; font:600 14px/1.4 'Segoe UI', system-ui, sans-serif;
    letter-spacing:2px; text-align:center; padding:24px;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="preview"></canvas>
<div id="status">BOOTING POSE ENGINE…</div>
<script>
(function () {
  'use strict';

  function post(msg) {
    try {
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    } catch (_e) { /* ignore */ }
  }

  function setStatus(t) {
    var el = document.getElementById('status');
    if (el) el.textContent = t;
  }

  var fileset = null;
  var landmarker = null;
  var lastTs = 0;
  var img = document.createElement('img');
  var canvas = document.getElementById('preview');
  var ctx = canvas && canvas.getContext('2d');
  var pendingFrame = null;
  var busy = false;

  function init() {
    return Vision.FilesetResolver.forVisionTasks('/mp/')
      .then(function (fs) {
        fileset = fs;
        return Vision.PoseLandmarker.createFromOptions(fs, {
          baseOptions: { modelAssetPath: '/models/pose_landmarker_lite.task' },
          runningMode: 'VIDEO',
          numPoses: 1,
          minPoseDetectionConfidence: 0.45,
          minPosePresenceConfidence: 0.45,
          minTrackingConfidence: 0.5,
        });
      })
      .then(function (pl) {
        landmarker = pl;
        setStatus('POSE ENGINE ONLINE');
        post({ type: 'ready' });
      })
      .catch(function (err) {
        setStatus('ENGINE FAILED: ' + (err && err.message ? err.message : err));
        post({ type: 'error', message: String(err && err.message || err) });
      });
  }

  function processFrame(msg) {
    if (!landmarker) return;
    var ts = msg.ts || (performance.now());
    if (ts <= lastTs) ts = lastTs + 1;
    lastTs = ts;
    busy = true;
    img.onload = function () {
      try {
        if (ctx && canvas) {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        }
        var res = landmarker.detectForVideo(img, ts);
        var lms = null;
        if (res.landmarks && res.landmarks.length > 0) {
          lms = res.landmarks[0].map(function (p) { return [p.x, p.y, p.z, p.visibility || 0]; });
        }
        post({ type: 'result', landmarks: lms, poses: res.landmarks ? res.landmarks.length : 0 });
      } catch (e) {
        post({ type: 'error', message: String(e && e.message || e) });
      } finally {
        busy = false;
        if (pendingFrame) {
          var next = pendingFrame;
          pendingFrame = null;
          processFrame(next);
        }
      }
    };
    img.onerror = function () {
      busy = false;
      pendingFrame = null;
    };
    img.src = 'data:image/jpeg;base64,' + msg.data;
  }

  window.addEventListener('message', function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (_e) { return; }
    if (!msg || msg.type !== 'frame' || !msg.data) return;
    if (busy) { pendingFrame = msg; return; }
    processFrame(msg);
  });

  init();
})();
</script>
</body>
</html>
